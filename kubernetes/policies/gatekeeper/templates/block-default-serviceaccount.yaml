apiVersion: templates.gatekeeper.sh/v1beta1
kind: ConstraintTemplate
metadata:
  name: k8sblockdefaultserviceaccount
spec:
  crd:
    spec:
      names:
        kind: K8sBlockDefaultServiceAccount
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8sblockdefaultserviceaccount
        violation[{
          "msg": msg
        }] {
          input.review.kind.kind == "Pod"
          input.review.object.spec.serviceAccountName == "default"
          msg := sprintf("Pod %v must not use the default service account", [input.review.object.metadata.name])
        }
