apiVersion: templates.gatekeeper.sh/v1beta1
kind: ConstraintTemplate
metadata:
  name: k8spspprivilegeescalation
spec:
  crd:
    spec:
      names:
        kind: K8sPSPPrivilegeEscalation
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8spspprivilegeescalation
        violation[{
          "msg": msg
        }] {
          input.review.kind.kind == "Pod"
          c := input.review.object.spec.containers[_]
          not c.securityContext.allowPrivilegeEscalation
          msg := sprintf("Container %v must not allow privilege escalation", [c.name])
        }
---
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sPSPPrivilegeEscalation
metadata:
  name: restrict-privilege-escalation
spec:
  enforcementAction: dryrun
