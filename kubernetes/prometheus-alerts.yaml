apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: devsecops-app-alerts
  labels:
    prometheus: devsecops
spec:
  groups:
    - name: devsecops-app.rules
      rules:
        - alert: AppDown
          expr: up{job="devsecops-app"} == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "DevSecOps app is down"
            description: "No metrics received from devsecops-app for 1 minute."
        - alert: HighErrorRate
          expr: increase(app_errors_total[5m]) > 5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High error rate in DevSecOps app"
            description: "More than 5 errors in the last 5 minutes."
