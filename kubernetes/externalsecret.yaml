apiVersion: external-secrets.io/v1alpha1
kind: ExternalSecret
metadata:
  name: devsecops-app-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: devsecops-app-secrets
    creationPolicy: Owner
  data:
    - secretKey: SUPABASE_URL
      remoteRef:
        key: devsecops-app/supabase-url
    - secretKey: SUPABASE_KEY
      remoteRef:
        key: devsecops-app/supabase-key
