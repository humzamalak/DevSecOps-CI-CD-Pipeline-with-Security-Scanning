# Tool configuration for the CI lint/test steps (run from the repo root)

[flake8]
max-line-length = 88
extend-ignore = E203, W503

[isort]
profile = black

[tool:pytest]
pythonpath = app

[coverage:run]
# auth_supabase.py is an integration outline that main.py does not import yet,
# and its supabase dependency is not installed, so it is excluded from coverage.
omit =
    app/tests/*
    app/auth_supabase.py
