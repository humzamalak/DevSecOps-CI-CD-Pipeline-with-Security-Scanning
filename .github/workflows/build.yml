name: CI Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Cosign keyless signing and SLSA provenance (OIDC)
      attestations: write # actions/attest-build-provenance
      security-events: write # Upload Semgrep SARIF to code scanning
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Cache Python dependencies
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('app/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install flake8 pytest

      # Linting and formatting checks
      - name: Lint (flake8)
        run: flake8 app/
      - name: Check formatting (black)
        run: black --check app/
      - name: Check imports (isort)
        run: isort --check-only app/

      # Run tests with coverage
      - name: Run unit tests with coverage
        run: pytest --cov=app --cov-fail-under=80 app/tests/

      # Cache Docker layers
      - name: Set up QEMU (for multi-arch builds)
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      # Only build and push multi-arch image on main branch
      - name: Configure AWS credentials
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        if: github.ref == 'refs/heads/main'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image (multi-arch)
        if: github.ref == 'refs/heads/main'
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/devsecops-app:latest,${{ steps.login-ecr.outputs.registry }}/devsecops-app:${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache

      # Cosign keyless signing (GitHub OIDC)
      - name: Install Cosign
        if: github.ref == 'refs/heads/main'
        run: |
          curl -sSL -o cosign https://github.com/sigstore/cosign/releases/download/v2.2.0/cosign-linux-amd64
          chmod +x cosign
          sudo mv cosign /usr/local/bin/
      - name: Sign container image with Cosign (keyless)
        if: github.ref == 'refs/heads/main'
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          cosign sign --yes ${{ steps.login-ecr.outputs.registry }}/devsecops-app@${{ steps.build-and-push.outputs.digest }}

      # SLSA provenance generation and attestation
      - name: Generate SLSA provenance
        if: github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ steps.login-ecr.outputs.registry }}/devsecops-app
          subject-digest: ${{ steps.build-and-push.outputs.digest }}
          push-to-registry: true

      - name: Build Docker image (PR/other branches)
        if: github.ref != 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: false
          load: true
          tags: devsecops-app:latest
          cache-from: type=local,src=/tmp/.buildx-cache

      # Trivy scans
      - name: Trivy scan (Dockerfile)
        uses: aquasecurity/trivy-action@v0.16.0
        with:
          scan-type: 'dockerfile'
          scan-ref: './app/Dockerfile'

      - name: Trivy scan (image)
        uses: aquasecurity/trivy-action@v0.16.0
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/devsecops-app:latest
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
        if: github.ref == 'refs/heads/main'
      - name: Trivy scan (image, PR/other branches)
        uses: aquasecurity/trivy-action@v0.16.0
        with:
          image-ref: 'devsecops-app:latest'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
        if: github.ref != 'refs/heads/main'

      # Semgrep SAST scan
      - name: Install Semgrep
        run: pip install semgrep
      - name: Run Semgrep SAST
        run: semgrep --config=auto --error --sarif --output=semgrep.sarif app/
      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif

      # Checkov IaC scan
      - name: Install Checkov
        run: pip install checkov
      - name: Run Checkov on Terraform
        run: checkov -d terraform/ --soft-fail --quiet --framework terraform
      - name: Run Checkov on Kubernetes
        run: checkov -d kubernetes/ --soft-fail --quiet --framework kubernetes
