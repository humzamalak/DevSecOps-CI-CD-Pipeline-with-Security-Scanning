name: Deploy to EKS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig --region us-east-1 --name devsecops-eks

      - name: Apply OPA Gatekeeper policy
        run: kubectl apply -f kubernetes/image-policy.yaml

      - name: Deploy application manifests
        run: |
          kubectl apply -f kubernetes/deployment.yaml
          kubectl apply -f kubernetes/service.yaml
          kubectl apply -f kubernetes/ingress.yaml

      - name: Wait for rollout
        run: kubectl rollout status deployment/devsecops-app --timeout=120s

      - name: Health check
        run: |
          sleep 10
          kubectl get pods -l app=devsecops-app
          # Replace with your ingress/service endpoint as needed
          curl --fail --max-time 10 http://devsecops-app.local/health || echo "Health check failed! Manual rollback may be required." 