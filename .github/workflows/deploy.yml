name: Deploy to EKS

on:
  # Deploy only after CI has built and pushed the image for this commit
  workflow_run:
    workflows: ["CI Build & Test"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.IMAGE_TAG }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig --region us-east-1 --name devsecops-eks

      - name: Apply OPA Gatekeeper policy
        run: |
          # The ConstraintTemplate must exist, and Gatekeeper must have created
          # its CRD, before the constraint in image-policy.yaml can be applied
          kubectl apply -f kubernetes/policies/gatekeeper/require-signed-images.yaml || true
          for _ in $(seq 1 30); do
            kubectl get crd k8srequiredsignatures.constraints.gatekeeper.sh >/dev/null 2>&1 && break
            sleep 2
          done
          kubectl wait --for condition=established --timeout=60s crd/k8srequiredsignatures.constraints.gatekeeper.sh
          kubectl apply -f kubernetes/policies/gatekeeper/require-signed-images.yaml
          kubectl apply -f kubernetes/image-policy.yaml

      - name: Deploy application manifests
        run: |
          # Replace the image placeholder with the image CI pushed for this commit
          sed "s#<ECR_REGISTRY>/devsecops-app:latest#${{ steps.login-ecr.outputs.registry }}/devsecops-app:${IMAGE_TAG}#" \
            kubernetes/deployment.yaml | kubectl apply -f -
          kubectl apply -f kubernetes/service.yaml
          kubectl apply -f kubernetes/ingress.yaml

      - name: Wait for rollout
        run: kubectl rollout status deployment/devsecops-app --timeout=120s

      - name: Health check
        run: |
          sleep 10
          kubectl get pods -l app=devsecops-app
          # Replace with your ingress/service endpoint as needed
          curl --fail --max-time 10 http://devsecops-app.local/health || echo "Health check failed! Manual rollback may be required." 