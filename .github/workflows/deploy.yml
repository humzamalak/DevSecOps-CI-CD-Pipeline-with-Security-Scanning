name: Deploy to EKS

on:
  # Deploy only after CI has built and pushed the image for this commit
  workflow_run:
    workflows: ["CI Build & Test"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    # Runs only when the repository variable AWS_DEPLOY_ENABLED is "true", so
    # forks and copies without an AWS account and EKS cluster skip it cleanly
    if: >-
      vars.AWS_DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.IMAGE_TAG }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Set up kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4.0.1

      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig --region us-east-1 --name devsecops-eks

      - name: Apply OPA Gatekeeper policies
        # Gatekeeper itself must already be installed in the cluster (see
        # kubernetes/policies/gatekeeper/README.md). Templates go first; each
        # constraint needs the CRD that Gatekeeper creates from its template.
        run: |
          kubectl apply -f kubernetes/policies/gatekeeper/templates/
          for crd in k8sblockdefaultserviceaccount k8srequiredlabels k8srequiredresources \
                     k8srequiredsignatures k8spsphostpathhostnetwork k8spspprivilegeescalation; do
            for _ in $(seq 1 30); do
              kubectl get crd "${crd}.constraints.gatekeeper.sh" >/dev/null 2>&1 && break
              sleep 2
            done
            kubectl wait --for condition=established --timeout=60s "crd/${crd}.constraints.gatekeeper.sh"
          done
          kubectl apply -f kubernetes/policies/gatekeeper/constraints/
          kubectl apply -f kubernetes/image-policy.yaml

      - name: Deploy application manifests
        run: |
          # Replace the image placeholder with the image CI pushed for this commit
          kubectl apply -f kubernetes/namespace.yaml
          kubectl apply -f kubernetes/serviceaccount.yaml
          kubectl apply -f kubernetes/networkpolicy.yaml
          sed -e "s#<ECR_REGISTRY>#${{ steps.login-ecr.outputs.registry }}#" -e "s#<IMAGE_TAG>#${IMAGE_TAG}#" \
            kubernetes/deployment.yaml | kubectl apply -f -
          kubectl apply -f kubernetes/service.yaml
          kubectl apply -f kubernetes/ingress.yaml

      - name: Wait for rollout
        run: kubectl -n devsecops rollout status deployment/devsecops-app --timeout=120s

      - name: Health check
        run: |
          sleep 10
          kubectl -n devsecops get pods -l app=devsecops-app
          # Replace with your ingress/service endpoint as needed
          curl --fail --max-time 10 http://devsecops-app.local/health || echo "Health check failed! Manual rollback may be required." 